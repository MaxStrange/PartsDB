[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partsdb"
version = "0.1.0"
description = "Parts inventory for electronics: KiCad BOM comparison, reservations, and barcode scanning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
partsdb = "partsdb.gui:main"

[tool.setuptools.packages.find]
include = ["partsdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
